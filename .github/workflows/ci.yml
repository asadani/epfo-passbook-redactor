name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev tools
        run: pip install -e ".[dev]"

      - name: Black
        run: black --check .

      - name: Flake8
        run: flake8

      - name: Pytest
        run: pytest -q

      - name: No real PDFs committed
        run: python scripts/check_no_real_pdfs.py $(git ls-files '*.pdf')
